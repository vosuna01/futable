name: Comprobaciones de FutABLE
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: futable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:auth

